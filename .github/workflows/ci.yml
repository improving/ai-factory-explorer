# Test, build, and smoke-test the AI Factory Explorer. The built single file is a workflow artifact.
# A tag v* attaches the built file to the release of the tag (a separate job: only that job can write).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install the packages
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (they also check each source of the catalog against the repository)
        run: npm test

      - name: Build the single file
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test of the built file
        run: npm run e2e

      - name: Upload the built file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-factory-explorer
          path: dist/index.html
          if-no-files-found: error

  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ai-factory-explorer
          path: dist

      - name: Attach the built file to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="ai-factory-explorer-${GITHUB_REF_NAME}.html"
          cp dist/index.html "$file"
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "AI Factory Explorer ${GITHUB_REF_NAME}" \
            --notes "The AI Factory Explorer as one HTML file, for offline use. Built from ${GITHUB_REF_NAME}." \
            "$file" ||
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "$file" --clobber

# An ordinary workload with NO GPU-related configuration at all:
# - no nvidia.com/gpu request
# - no hostPath or mock-library volumes
# - no LD_PRELOAD, MOCK_*, or PATH env
#
# If the NRI overlay is working, `nvidia-smi` still runs inside this container
# because the plugin edited the OCI spec at container-creation time, ambiently.
# Deploy this into a namespace that is NOT excluded from NRI injection (not the
# nvml-mock release's own namespace, and not kube-system).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-agent-manual
  namespace: default
spec:
  selector:
    matchLabels:
      app: gpu-agent-manual
  template:
    metadata:
      labels:
        app: gpu-agent-manual
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]

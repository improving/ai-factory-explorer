# Heterogeneous fleet: one control-plane, one A100 worker, one T4 worker.
# Used by the "different GPU models on different nodes" stretch goal.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      nvml-mock/profile: a100
  - role: worker
    labels:
      nvml-mock/profile: t4

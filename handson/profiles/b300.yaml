# Mock NVML profile: HGX B300 node (8 x NVIDIA B300 SXM6 AC, x86 host, NVSwitch baseboard).
#
# Mokka v0.4.0 has no b300 profile. This file is derived from the upstream v0.4.0 profiles
# (NVIDIA/k8s-test-infra, deployments/nvml-mock/helm/nvml-mock/profiles/, Apache-2.0):
# - GPU values (driver, memory 288 GiB, clocks, ECC, fabric state) from gb300.yaml: the same B300 GPU.
# - Node layout (8 devices, 2 NUMA nodes, PCIe tree, one HCA per GPU) from b200.yaml: the HGX baseboard.
# Changed for HGX B300 (handbook/hardware-matrix.md): name, 1100 W power limit, NVLink 5 through two
# NVSwitch chips (topo -m shows NV18), no Grace CPU, ConnectX-8 at 800 Gb/s.
# Other identity strings (serials, vbios, PCI device ID) are illustrative, not read from a real B300.
#
# Use: helm install ... --set-file gpu.customConfig=handson/profiles/b300.yaml
